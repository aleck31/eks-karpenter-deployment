# Playwright / API / worker / nuq-worker / nuq-prefetch-worker
# 镜像用官方 ghcr.io/firecrawl/*（上游 helm chart 指向第三方 docker.io/winkkgmbh/*）
# --max-old-space-size 必须低于 memory limit，否则 V8 在 GC 前先被 OOMKill

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: playwright-service
  namespace: firecrawl
  labels:
    app: playwright-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: playwright-service
  template:
    metadata:
      labels:
        app: playwright-service
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: playwright-service
          # 仅有 latest 标签，用 digest 固定
          image: ghcr.io/firecrawl/playwright-service:latest@sha256:df1a393ce8bfc3801570a826a9b0dcc400ae48789adb4a0ad9d6cbf0229b059b
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: playwright-service-config
          resources:
            requests:
              cpu: 300m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 3Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: playwright-service
  namespace: firecrawl
  labels:
    app: playwright-service
spec:
  type: ClusterIP
  selector:
    app: playwright-service
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: 3000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: firecrawl
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      # 抓取作业可跑 60s+，留够优雅退出时间应对 Spot 回收
      terminationGracePeriodSeconds: 110
      containers:
        - name: api
          image: ghcr.io/firecrawl/firecrawl:2.11.209@sha256:cebde741a0e6e8711f6714da0aab507f1285d3a083594728df23a31e19eeb7fb
          imagePullPolicy: IfNotPresent
          command: ["node"]
          args: ["--max-old-space-size=2048", "dist/src/index.js"]
          ports:
            - containerPort: 3002
              name: http
          env:
            - name: FLY_PROCESS_GROUP
              value: "app"
            - name: NUQ_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - configMapRef:
                name: firecrawl-config
            - secretRef:
                name: firecrawl-secret
            - secretRef:
                name: firecrawl-db
          resources:
            requests:
              cpu: 300m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 3Gi
          livenessProbe:
            httpGet:
              path: /v0/health/liveness
              port: 3002
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            # 仅心跳，不校验 Redis / PG / RabbitMQ / Playwright，判断可用性看 verify.sh
            httpGet:
              path: /v0/health/readiness
              port: 3002
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4

---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: firecrawl
  labels:
    app: api
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
    - name: http
      protocol: TCP
      port: 3002
      targetPort: 3002

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: firecrawl
  labels:
    app: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: ghcr.io/firecrawl/firecrawl:2.11.209@sha256:cebde741a0e6e8711f6714da0aab507f1285d3a083594728df23a31e19eeb7fb
          imagePullPolicy: IfNotPresent
          command: ["node"]
          args: ["--max-old-space-size=1280", "dist/src/services/queue-worker.js"]
          ports:
            - containerPort: 3005
              name: http
          env:
            - name: FLY_PROCESS_GROUP
              value: "worker"
            - name: NUQ_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - configMapRef:
                name: firecrawl-config
            - secretRef:
                name: firecrawl-secret
            - secretRef:
                name: firecrawl-db
          resources:
            requests:
              cpu: 200m
              memory: 768Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /liveness
              port: 3005
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nuq-worker
  namespace: firecrawl
  labels:
    app: nuq-worker
spec:
  # 改此值必须同步 ConfigMap 的 NUQ_WORKER_COUNT（上游默认 5，对小集群过重）
  replicas: 2
  selector:
    matchLabels:
      app: nuq-worker
  template:
    metadata:
      labels:
        app: nuq-worker
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      terminationGracePeriodSeconds: 60
      # 分散到不同节点，Spot 单节点回收不至于全灭
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: nuq-worker
      containers:
        - name: nuq-worker
          image: ghcr.io/firecrawl/firecrawl:2.11.209@sha256:cebde741a0e6e8711f6714da0aab507f1285d3a083594728df23a31e19eeb7fb
          imagePullPolicy: IfNotPresent
          command: ["node"]
          args: ["--max-old-space-size=1280", "dist/src/services/worker/nuq-worker.js"]
          ports:
            - containerPort: 3006
              name: http
          env:
            - name: FLY_PROCESS_GROUP
              value: "nuq-worker"
            - name: NUQ_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - configMapRef:
                name: firecrawl-config
            - secretRef:
                name: firecrawl-secret
            - secretRef:
                name: firecrawl-db
          resources:
            requests:
              cpu: 200m
              memory: 768Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 3006
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3006
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nuq-prefetch-worker
  namespace: firecrawl
  labels:
    app: nuq-prefetch-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nuq-prefetch-worker
  template:
    metadata:
      labels:
        app: nuq-prefetch-worker
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      terminationGracePeriodSeconds: 60
      containers:
        - name: nuq-prefetch-worker
          image: ghcr.io/firecrawl/firecrawl:2.11.209@sha256:cebde741a0e6e8711f6714da0aab507f1285d3a083594728df23a31e19eeb7fb
          imagePullPolicy: IfNotPresent
          command: ["node"]
          args: ["--max-old-space-size=640", "dist/src/services/worker/nuq-prefetch-worker.js"]
          ports:
            - containerPort: 3011
              name: http
          env:
            - name: FLY_PROCESS_GROUP
              value: "nuq-prefetch-worker"
            - name: NUQ_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - configMapRef:
                name: firecrawl-config
            - secretRef:
                name: firecrawl-secret
            - secretRef:
                name: firecrawl-db
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 3011
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3011
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
