apiVersion: v1
kind: ConfigMap
metadata:
  name: auto-draw-io-config
data:
  # 以下为环境无关配置。
  # APP_BASE_URL / AWS_REGION 由 overlays/<env>/ 以 behavior: merge 注入
  AI_PROVIDER: "bedrock"
  AI_MODELS: "global.anthropic.claude-sonnet-5,global.anthropic.claude-opus-5,global.anthropic.claude-opus-4-8"
  TEMPERATURE: "0"
