apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 示例 overlay：展示需要按环境提供哪些值。
# 用法：复制本目录为 overlays/<环境名>/，填入真实值。

namespace: bitwarden

resources:
  - ../../base

# 只覆盖随环境变化的键，其余保留 base 中的取值
configMapGenerator:
  - name: bitwarden-config
    behavior: merge
    literals:
      - BW_DOMAIN=bitwarden.yourdomain.com
      - globalSettings__mail__replyToEmail=no-reply@yourdomain.com
      - adminSettings__admins=admin@yourdomain.com

generatorOptions:
  disableNameSuffixHash: true
