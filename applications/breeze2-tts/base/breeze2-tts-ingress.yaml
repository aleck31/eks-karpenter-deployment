# Breeze TTS 2 ALB Ingress - 共享 qwen3-speech ALB
# :8880 → Breeze TTS 2 (OpenAI 兼容接口 /v1/audio/speech)
#
# 该端口原由 voxcpm2-tts 占用。同一 ALB group 内一个 listen-port 只能由一个
# Ingress 声明，两者不可同时存在，切换步骤见部署指南。
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: breeze2-tts-ingress
  annotations:
    alb.ingress.kubernetes.io/group.name: speech-services
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":8880}]'
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=1800
spec:
  ingressClassName: alb
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: breeze2-tts-service
            port:
              number: 80
