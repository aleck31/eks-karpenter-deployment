# Breeze TTS 2 ALB Ingress
# :8880 → Breeze TTS 2 (OpenAI 兼容接口 /v1/audio/speech)
# 共享 ALB（group.name）、来源限制等环境取值由 overlay 注入。同一 ALB group 内
# 一个 listen-port 只能由一个 Ingress 声明。
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: breeze2-tts-ingress
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":8880}]'
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=1800
spec:
  ingressClassName: alb
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: breeze2-tts-service
            port:
              number: 80
