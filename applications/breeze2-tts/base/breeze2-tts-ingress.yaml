# Breeze TTS 2 ALB Ingress
# HTTPS :443 → Breeze TTS 2 (OpenAI 兼容接口 /v1/audio/speech)，TLS 在 ALB 终止。
# 按主机名路由，同一 ALB group 内的服务可共用 :443。
# 主机名、证书、共享 ALB（group.name）与来源限制由 overlay 注入。
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: breeze2-tts-ingress
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=1800
spec:
  ingressClassName: alb
  rules:
  - host: tts.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: breeze2-tts-service
            port:
              number: 80
