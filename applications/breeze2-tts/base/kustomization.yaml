apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# base 只描述结构。namespace 与 ECR 账号由 overlays/<env>/ 注入。
resources:
  - breeze2-tts-deployment.yaml
  - breeze2-tts-ingress.yaml

configMapGenerator:
  - name: breeze2-tts-adapter
    files:
      - openai-adapter.py
  # 覆盖镜像内的 vllm_omni/deploy/breeze_tts_2.yaml，改并发不必重建镜像。
  - name: breeze2-tts-deploy-config
    files:
      - vllm-omni-deploy-config.yaml
