# R2T2 ASR ALB Ingress
# HTTPS :443 → ASR（HTTP 接口与 wss:// 实时会话），TLS 在 ALB 终止，按主机名路由。
# 主机名、证书、共享 ALB（group.name）与来源限制由 overlay 注入。
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: r2t2-asr-ingress
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/healthcheck-path: /health
    # 实时会话是长连接；同一 ALB group 内各 Ingress 的该值须一致
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=1800
spec:
  ingressClassName: alb
  rules:
  - host: asr.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: r2t2-asr-service
            port:
              number: 80
