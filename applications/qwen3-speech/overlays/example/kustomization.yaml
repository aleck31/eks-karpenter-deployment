apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 示例 overlay：展示需要按环境提供哪些值。
# 用法：复制本目录为 overlays/<环境名>/，按需增删 resources 中的服务。

namespace: your-namespace

# 按需组合。shared 提供模型共享存储，各服务都依赖它
resources:
  - ../../base/shared
  - ../../base/asr
  - ../../base/tts        # Qwen3-TTS CustomVoice，不需要可注释掉
  - ../../base/tts-base   # Qwen3-TTS Base（声音克隆），不需要可注释掉

# EFS 文件系统 ID（每个集群不同）
patches:
  - path: efs-patch.yaml

images:
  - name: 123456789012.dkr.ecr.us-west-2.amazonaws.com/qwen3-asr
    newName: <your-account-id>.dkr.ecr.<your-region>.amazonaws.com/qwen3-asr
    newTag: latest
  - name: 123456789012.dkr.ecr.us-west-2.amazonaws.com/qwen3-tts
    newName: <your-account-id>.dkr.ecr.<your-region>.amazonaws.com/qwen3-tts
    newTag: latest
