apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen3-asr
  labels:
    app: qwen3-asr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qwen3-asr
  template:
    metadata:
      labels:
        app: qwen3-asr
    spec:
      initContainers:
      - name: model-downloader
        image: 123456789012.dkr.ecr.us-west-2.amazonaws.com/qwen3-asr:latest
        command:
        - bash
        - -c
        - |
          MODEL_DIR="/models/Qwen3-ASR-1.7B"
          if [ -f "$MODEL_DIR/model-00001-of-00002.safetensors" ] && \
             [ -f "$MODEL_DIR/model-00002-of-00002.safetensors" ] && \
             [ -f "$MODEL_DIR/config.json" ]; then
            echo "Model complete, skipping download"
          else
            echo "Model incomplete or missing, downloading..."
            rm -rf "$MODEL_DIR"
            huggingface-cli download Qwen/Qwen3-ASR-1.7B --local-dir "$MODEL_DIR"
          fi
        volumeMounts:
        - name: models
          mountPath: /models
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            cpu: 1
            memory: 4Gi

      containers:
      - name: asr
        image: 123456789012.dkr.ecr.us-west-2.amazonaws.com/qwen3-asr:latest
        args:
        - --model
        - /models/Qwen3-ASR-1.7B
        # KV cache is sized in bytes, not as a share of the card. A fraction
        # tied the footprint to whichever GPU Karpenter landed on (0.35 is 8.4
        # GiB on an L4, 11 GiB on a 32 GB card) and filled the whole share with
        # KV: 5.93 GiB reserved against a measured peak of 0.75 GiB (12.3% with
        # 4 requests running). 3 GiB holds ~28k tokens -- ~12 concurrent 120s
        # segments, three long uploads at full fan-out -- and past that vLLM
        # queues requests rather than failing.
        #
        # Steady-state footprint is ~9 GiB: weights 3.9 + profiled activations
        # ~1.15 + KV 3.0 + ~1 of allocator growth observed after startup. The
        # GPU is time-sliced with TTS and other tenants and nothing isolates
        # memory, so the sum across tenants is what has to fit.
        - --kv-cache-memory-bytes
        - "3G"
        # With kv-cache-memory-bytes set this no longer sizes anything; vLLM
        # only checks at startup that free memory >= fraction x total, and
        # refuses to start otherwise. 0.28 of a 31.38 GiB card is 8.79 GiB,
        # just above the 8.05 GiB startup needs, so a crowded card fails fast
        # with a clear message instead of OOMing mid-load.
        - --gpu-memory-utilization
        - "0.28"
        # Sized for one VAD segment, not a whole recording: the adapter splits at
        # silence and sends at most 120s, which is ~2030 tokens at the measured
        # 13.0 audio tokens per second.
        #
        # Both ceilings have to move together. vLLM sets encoder_cache_size from
        # max_num_batched_tokens verbatim, while audio tokens also count toward
        # max_model_len -- raising only one just relocates the rejection.
        - --max-model-len
        - "8192"
        # Left at vLLM's default; a 120s segment needs ~1560 audio tokens.
        - --max-num-batched-tokens
        - "2048"
        - --host
        - "0.0.0.0"
        - --port
        - "8000"
        - --enforce-eager
        # Required for the realtime WebSocket path. vLLM's AsyncScheduler
        # underflows num_output_placeholders when a streaming segment's final
        # prefill chunk is appended mid-generation, killing the EngineCore
        # (vllm-project/vllm#35755, still unfixed on main; the fix PR #50692 is
        # open). Measured here: 19s of audio gives 4 assertion failures and a
        # truncated transcript with async scheduling on, 0 with it off.
        # Costs 3-8% throughput. Drop this once a release carries the fix.
        - --no-async-scheduling
        - --hf-overrides
        - '{"architectures": ["Qwen3ASRRealtimeGeneration"]}'
        env:
        # The 2026-10-01 OOM failed a 370 MiB allocation with 364 MiB reserved
        # by PyTorch but unusable, split across fragments. Expandable segments
        # let the allocator grow mappings in place instead of stranding them.
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: expandable_segments:True
        # Read by the adapter's uvicorn through click's UVICORN_ env prefix, so
        # no image rebuild is needed. uvicorn's default is 5s against the ALB's
        # 1800s idle timeout; AWS requires the target to outlast the ALB, or
        # the ALB can reuse a connection the target already closed and return
        # a 502.
        - name: UVICORN_TIMEOUT_KEEP_ALIVE
          value: "1830"
        ports:
        - containerPort: 8001
          name: http
        volumeMounts:
        - name: models
          mountPath: /models
          readOnly: true
        # Overrides the copy baked into the image.
        - name: adapter
          mountPath: /app/asr-adapter.py
          subPath: asr-adapter.py
          readOnly: true
        resources:
          requests:
            cpu: 500m
            memory: 3Gi
            nvidia.com/gpu: 1
          limits:
            cpu: "2"
            memory: 8Gi
            nvidia.com/gpu: 1
        # Startup and readiness gate on /ready, which checks vLLM; liveness stays
        # on /health, which only checks the adapter. On /health alone the pod
        # went Ready 63s before vLLM finished loading (09:29:51 vs 09:30:54 on
        # 2026-10-01), so the ALB routed requests into a backend that could not
        # serve them. Liveness must not follow: during a reload vLLM is down by
        # design, and restarting the container then would only restart the load.
        startupProbe:
          httpGet:
            path: /ready
            port: 8001
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8001
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: qwen3-models-pvc
      - name: adapter
        configMap:
          name: qwen3-asr-adapter

      tolerations:
      - key: nvidia.com/gpu
        operator: Equal
        value: "true"
        effect: NoSchedule
      nodeSelector:
        node-type: gpu
      affinity:
        nodeAffinity:
          # 硬约束: 仅调度到 24GB 显存 GPU (L4/A10G)
          # g4dn 保留给其他小模型 GPU 应用使用
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node.kubernetes.io/instance-type
                operator: In
                values: ["g7.2xlarge", "g7.4xlarge", "g6.xlarge", "g6.2xlarge", "g6.4xlarge", "g5.xlarge", "g5.2xlarge", "g5.4xlarge"]
          preferredDuringSchedulingIgnoredDuringExecution:
          # g7 优先：Spot 容量评分四个 AZ 均为最高档（g6 仅 2~4），
          # 32GB 显存可与另两个推理服务共用一张卡
          - weight: 90
            preference:
              matchExpressions:
              - key: node.kubernetes.io/instance-type
                operator: In
                values: ["g7.2xlarge", "g7.4xlarge"]
          - weight: 80
            preference:
              matchExpressions:
              - key: node.kubernetes.io/instance-type
                operator: In
                values: ["g6.xlarge", "g6.2xlarge", "g6.4xlarge"]

      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: qwen3-asr-service
  labels:
    app: qwen3-asr
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8001
    protocol: TCP
    name: http
  selector:
    app: qwen3-asr
