apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen3-asr
  labels:
    app: qwen3-asr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qwen3-asr
  template:
    metadata:
      labels:
        app: qwen3-asr
    spec:
      initContainers:
      - name: model-downloader
        image: 123456789012.dkr.ecr.us-west-2.amazonaws.com/qwen3-asr:latest
        command:
        - bash
        - -c
        - |
          MODEL_DIR="/models/Qwen3-ASR-1.7B"
          if [ -f "$MODEL_DIR/model-00001-of-00002.safetensors" ] && \
             [ -f "$MODEL_DIR/model-00002-of-00002.safetensors" ] && \
             [ -f "$MODEL_DIR/config.json" ]; then
            echo "Model complete, skipping download"
          else
            echo "Model incomplete or missing, downloading..."
            rm -rf "$MODEL_DIR"
            huggingface-cli download Qwen/Qwen3-ASR-1.7B --local-dir "$MODEL_DIR"
          fi
        volumeMounts:
        - name: models
          mountPath: /models
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            cpu: 1
            memory: 4Gi

      containers:
      - name: asr
        image: 123456789012.dkr.ecr.us-west-2.amazonaws.com/qwen3-asr:latest
        args:
        - --model
        - /models/Qwen3-ASR-1.7B
        - --gpu-memory-utilization
        - "0.35"
        # Sized for one VAD segment, not a whole recording: the adapter splits at
        # silence and sends at most 120s, which is ~2030 tokens at the measured
        # 13.0 audio tokens per second.
        #
        # Both ceilings have to move together. vLLM sets encoder_cache_size from
        # max_num_batched_tokens verbatim, while audio tokens also count toward
        # max_model_len -- raising only one just relocates the rejection. They
        # share the gpu-memory-utilization budget, so an oversized max_model_len
        # reserves KV cache for sequences that cannot occur and starves the
        # encoder cache.
        - --max-model-len
        - "8192"
        # Left at vLLM's default; a 120s segment needs ~1560 audio tokens.
        - --max-num-batched-tokens
        - "2048"
        - --host
        - "0.0.0.0"
        - --port
        - "8000"
        - --enforce-eager
        # Required for the realtime WebSocket path. vLLM's AsyncScheduler
        # underflows num_output_placeholders when a streaming segment's final
        # prefill chunk is appended mid-generation, killing the EngineCore
        # (vllm-project/vllm#35755, still unfixed on main; the fix PR #50692 is
        # open). Measured here: 19s of audio gives 4 assertion failures and a
        # truncated transcript with async scheduling on, 0 with it off.
        # Costs 3-8% throughput. Drop this once a release carries the fix.
        - --no-async-scheduling
        - --hf-overrides
        - '{"architectures": ["Qwen3ASRRealtimeGeneration"]}'
        ports:
        - containerPort: 8001
          name: http
        volumeMounts:
        - name: models
          mountPath: /models
          readOnly: true
        resources:
          requests:
            cpu: 500m
            memory: 3Gi
            nvidia.com/gpu: 1
          limits:
            cpu: "2"
            memory: 8Gi
            nvidia.com/gpu: 1
        startupProbe:
          httpGet:
            path: /health
            port: 8001
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: qwen3-models-pvc

      tolerations:
      - key: nvidia.com/gpu
        operator: Equal
        value: "true"
        effect: NoSchedule
      nodeSelector:
        node-type: gpu
      affinity:
        nodeAffinity:
          # 硬约束: 仅调度到 24GB 显存 GPU (L4/A10G)
          # g4dn 保留给其他小模型 GPU 应用使用
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node.kubernetes.io/instance-type
                operator: In
                values: ["g6.xlarge", "g6.2xlarge", "g6.4xlarge", "g5.xlarge", "g5.2xlarge", "g5.4xlarge"]
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 80
            preference:
              matchExpressions:
              - key: node.kubernetes.io/instance-type
                operator: In
                values: ["g6.xlarge", "g6.2xlarge", "g6.4xlarge"]

      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: qwen3-asr-service
  labels:
    app: qwen3-asr
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8001
    protocol: TCP
    name: http
  selector:
    app: qwen3-asr
