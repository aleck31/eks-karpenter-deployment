apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 示例 overlay。复制本目录为 overlays/<集群名>/，替换集群名、角色名，
# 并按实际需要调整机型列表。
resources:
  - ../../base

patches:
  - path: nodeclass-patch.yaml
    target:
      kind: EC2NodeClass
      name: gpu
  - path: nodepool-patch.yaml
    target:
      kind: NodePool
      name: gpu
