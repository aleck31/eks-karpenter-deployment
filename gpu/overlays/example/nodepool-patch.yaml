# 按本集群实际需要收窄机型与架构。base 保留全量目录供选择。
# 此处示例只保留单卡 x86 机型：多卡机型在时间切片下切片数翻倍、
# 与按卡规划的容量假设不符；g5g 为 ARM64，GPU 镜像多为 amd64。
- op: replace
  path: /spec/template/spec/requirements/1/values
  value: ["amd64"]
- op: replace
  path: /spec/template/spec/requirements/2/values
  value:
    - g4dn.xlarge
    - g4dn.2xlarge
    - g4dn.4xlarge
    - g5.xlarge
    - g5.2xlarge
    - g5.4xlarge
    - g6.xlarge
    - g6.2xlarge
    - g6.4xlarge
