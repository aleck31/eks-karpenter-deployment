# 示例：与语音推理服务共置到同一张卡的轻量 GPU 负载。
# Karpenter 按 CPU/内存/GPU 数量选型，不感知显存需求，也不知道时间切片，
# 因此需要工作负载自己声明偏好，才能汇聚到已有节点而不是各开一台。
#
# 用 preferred 而非 required：目标机型 Spot 容量不足时可回退，不阻塞调度。
#
#   kubectl -n <namespace> patch deployment <name> --patch-file gpu/light-gpu-affinity-patch.yaml
spec:
  template:
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            # 与语音服务取相同的首选机型，汇聚到同一张卡的不同切片
            - weight: 90
              preference:
                matchExpressions:
                  - key: node.kubernetes.io/instance-type
                    operator: In
                    values:
                      - g7.2xlarge
                      - g7.4xlarge
            # 回退：显存充足的单卡机型
            - weight: 40
              preference:
                matchExpressions:
                  - key: node.kubernetes.io/instance-type
                    operator: In
                    values:
                      - g6.2xlarge
                      - g5.2xlarge
