# GPU 主池：优先 Spot，买不到时自动转按需（覆盖全部机型），
# 故 weight 须高于任何按需兜底池。
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu
spec:
  weight: 10
  limits:
    cpu: 32
    memory: 128Gi
  disruption:
    # 不用 WhenEmptyOrUnderutilized：它会为整合利用率驱逐推理 Pod，
    # 而模型重新加载需数分钟
    consolidationPolicy: WhenEmpty
    # WhenEmpty 下这不是整合延迟，而是空节点的保留时长。渲染任务成批到达
    # （实测一批 8 个落在 2 分钟内），而 Karpenter 看不到 GPU 时间切片，
    # 每个 Pod 都会换来一个 NodeClaim。留久一点，同批后续任务就能落到
    # 已有节点的空切片上，省掉冷启动——冷启动比渲染本身还长。
    consolidateAfter: 45m
    # 必须显式声明：默认 10%，节点数不足 10 时向下取整为 0，回收被完全禁止
    budgets:
      - nodes: "1"
  template:
    metadata:
      labels:
        node-type: gpu
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: gpu
      taints:
        - key: nvidia.com/gpu
          effect: NoSchedule
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64", "arm64"]
        # 全量 GPU 机型目录。base 保留完整选项，overlay 按实际部署收窄。
        # 注意多卡机型（4x GPU）在时间切片下切片数翻倍，g5g 为 ARM64。
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            # T4 16GB (x86_64) — 小模型推理，单价最低
            - g4dn.xlarge     # 1x T4,  4 vCPU,  16 GB, 125GB NVMe
            - g4dn.2xlarge    # 1x T4,  8 vCPU,  32 GB, 225GB NVMe
            - g4dn.4xlarge    # 1x T4, 16 vCPU,  64 GB, 225GB NVMe
            - g4dn.8xlarge    # 1x T4, 32 vCPU, 128 GB, 900GB NVMe
            - g4dn.12xlarge   # 4x T4, 48 vCPU, 192 GB, 900GB NVMe

            # T4g 16GB (ARM64) — 成本优化，需 arm64 镜像
            - g5g.xlarge      # 1x T4g,  4 vCPU,   8 GB
            - g5g.2xlarge     # 1x T4g,  8 vCPU,  16 GB
            - g5g.4xlarge     # 1x T4g, 16 vCPU,  32 GB
            - g5g.8xlarge     # 1x T4g, 32 vCPU,  64 GB
            - g5g.16xlarge    # 2x T4g, 64 vCPU, 128 GB

            # A10G 24GB (x86_64) — 中大模型推理
            - g5.xlarge       # 1x A10G,  4 vCPU,  16 GB
            - g5.2xlarge      # 1x A10G,  8 vCPU,  32 GB
            - g5.4xlarge      # 1x A10G, 16 vCPU,  64 GB
            - g5.8xlarge      # 1x A10G, 32 vCPU, 128 GB
            - g5.12xlarge     # 4x A10G, 48 vCPU, 192 GB

            # L4 23GB (x86_64) — 能效比更好
            - g6.xlarge       # 1x L4,  4 vCPU,  16 GB
            - g6.2xlarge      # 1x L4,  8 vCPU,  32 GB
            - g6.4xlarge      # 1x L4, 16 vCPU,  64 GB
            - g6.8xlarge      # 1x L4, 32 vCPU, 128 GB
            - g6.12xlarge     # 4x L4, 48 vCPU, 192 GB

            # L40S 48GB (x86_64) — 高性能推理
            - g6e.xlarge      # 1x L40S,  4 vCPU,  16 GB
            - g6e.2xlarge     # 1x L40S,  8 vCPU,  32 GB
            - g6e.4xlarge     # 1x L40S, 16 vCPU,  64 GB
            - g6e.8xlarge     # 1x L40S, 32 vCPU, 128 GB
            - g6e.12xlarge    # 4x L40S, 48 vCPU, 192 GB

            # RTX PRO 4500 32GB (x86_64) — Spot 供给最好（四 AZ 均为最高档），
            # 显存高于 L4，无 xlarge 档
            - g7.2xlarge      # 1x RTX PRO 4500,  8 vCPU,  32 GB
            - g7.4xlarge      # 1x RTX PRO 4500, 16 vCPU,  64 GB
            - g7.8xlarge      # 1x RTX PRO 4500, 32 vCPU, 128 GB
            - g7.12xlarge     # 2x RTX PRO 4500, 48 vCPU, 192 GB

            # L4 分片 vGPU (x86_64) — 单价最低，但 EC2 报告 GPU Count=0，
            # 需 NodeOverlay 补 capacity 才能被 Karpenter 调度
            - g6f.xlarge      # L4 分片  2GB,  4 vCPU,  16 GB
            - g6f.2xlarge     # L4 分片  5GB,  8 vCPU,  32 GB
            - g6f.4xlarge     # L4 分片 11GB, 16 vCPU,  64 GB

---
# g6f/gr6f 是 L4 的 vGPU 分片机型。EC2 的 DescribeInstanceTypes 对它们报告
# GpuInfo.Gpus[0].Count = 0，Karpenter 因此认为无 GPU，请求 nvidia.com/gpu
# 的 Pod 永远不会被调度到这类节点上。此处补上容量声明。
#
# 显存按分片大小递减（2/5/11GB），适合显存需求很小的负载：
# 渲染任务实测仅 545MB，g6f.2xlarge 的 Spot 单价为 g6.2xlarge 的 26%。
#
# 需 Karpenter 开启 --set settings.featureGates.nodeOverlay=true，否则本对象被忽略。
# NodeOverlay 目前为 alpha (v1alpha1)。
apiVersion: karpenter.sh/v1alpha1
kind: NodeOverlay
metadata:
  name: gpu-fractional-capacity
spec:
  requirements:
    - key: karpenter.k8s.aws/instance-family
      operator: In
      values: ["g6f", "gr6f"]
  capacity:
    nvidia.com/gpu: "1"
