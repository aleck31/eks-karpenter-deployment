# arm64 节点的 EC2 配置。role 与 discovery 标签为集群专属，由 overlay 覆盖。
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: arm64
spec:
  # 用 alias 而非固定 AMI 名（后者含 K8s 版本号，集群升级后会失配）。
  # alias 模式下 Karpenter 自动注入 nodeadm bootstrap；
  # 改用 amiSelectorTerms.name 则必须同时提供 amiFamily 与 userData。
  amiSelectorTerms:
    - alias: al2023@latest

  instanceStorePolicy: RAID0

  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpTokens: required
    httpPutResponseHopLimit: 2   # 容器需访问 IMDS

  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 100Gi
        volumeType: gp3
        deleteOnTermination: true

  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "CLUSTER_NAME"
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "CLUSTER_NAME"
  role: "KarpenterNodeInstanceRole-CLUSTER_NAME"
