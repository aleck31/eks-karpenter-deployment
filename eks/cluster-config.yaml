# cluster-config.yaml - 集群、IAM 与插件配置
#
# 注意 vpc-cni 与 aws-ebs-csi-driver 的 Pod Identity 关联由 addon 自身管理，
# 这样 addon 的 serviceAccountRoleArn 会被清空、ServiceAccount 上不留 IRSA 注解。
# 对已存在的集群直接执行 eksctl create podidentityassociation 会因关联已存在而报 409，
# 这两个应改用：
#   aws eks update-addon --cluster-name <cluster> --addon-name vpc-cni \
#     --pod-identity-associations serviceAccount=aws-node,roleArn=<role-arn>
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: eks-karpenter-env
  region: ap-southeast-1
  version: "1.35"

# VPC 配置 - 使用 10.1.0.0/16 网段
vpc:
  cidr: "10.1.0.0/16"

  # API Server 端点访问控制。
  #
  # 认证本身是强制的：无凭据请求 /version 或 /api 均返回 401，
  # 仅 /healthz、/livez 匿名可达（只暴露存活状态）。因此公网端点并非"敞开"，
  # 收窄的目的是缩小攻击面，而非补认证。
  #
  # 必须先开 privateAccess 再收窄 publicAccessCIDRs：
  # privateAccess 为 false 时节点是经 NAT 走公网端点连 API Server 的，
  # 此时收窄白名单若未包含 NAT 出口 IP，将导致全部节点失联。
  # 开启 privateAccess 后节点改走 VPC 内路径，白名单只需覆盖运维出口。
  #
  # publicAccessCIDRs 只接受 CIDR 字面量，不能引用托管前缀列表 ID，
  # 故由 eks/sync-endpoint-cidrs.sh 从前缀列表展开同步（上限 40 条）。
  clusterEndpoints:
    publicAccess: true
    privateAccess: true

# 可用区配置 (新加坡区域 3 个 AZ)
availabilityZones:
  - ap-southeast-1a
  - ap-southeast-1b
  - ap-southeast-1c

# IAM 配置
iam:
  withOIDC: true

  # Pod Identity 关联。前三个使用跨集群共用角色，
  # 由 eks/shared-pod-identity-roles.cfn.yaml 创建，多集群共用同一角色。
  # 变更角色前用 eks/compare-role-permissions.py 校验权限一致性。
  podIdentityAssociations:
    - namespace: kube-system
      serviceAccountName: aws-node
      roleARN: arn:aws:iam::123456789012:role/SharedPodIdentity-VPCCNI

    - namespace: kube-system
      serviceAccountName: ebs-csi-controller-sa
      roleARN: arn:aws:iam::123456789012:role/SharedPodIdentity-EBSCSI

    - namespace: kube-system
      serviceAccountName: aws-load-balancer-controller
      roleARN: arn:aws:iam::123456789012:role/SharedPodIdentity-ALBController

    # EFS CSI 与 S3 CSI 的策略限定具体文件系统与桶，不跨集群共用。
    # 角色为 eksctl 创建 addon 时生成，名称含随机后缀，此处以占位符表示实际 ARN。
    - namespace: kube-system
      serviceAccountName: efs-csi-controller-sa
      roleARN: arn:aws:iam::123456789012:role/eksctl-CLUSTER-addon-aws-efs-csi-dr-Role1-EXAMPLE

    - namespace: kube-system
      serviceAccountName: s3-csi-driver-sa
      roleARN: arn:aws:iam::123456789012:role/eksctl-CLUSTER-addon-aws-mountpoint-Role1-EXAMPLE

    # Loki 需读写自己的 S3 桶，策略含桶名，不共用
    - namespace: logging
      serviceAccountName: loki
      roleARN: arn:aws:iam::123456789012:role/LokiS3Role-CLUSTER

    # Karpenter 亦使用 Pod Identity。其策略含 cluster tag 条件与集群专属节点角色，
    # 不与其他集群共用，由 karpenter/apply-karpenter-policy.sh 按集群渲染。
    - namespace: karpenter
      serviceAccountName: karpenter
      roleARN: arn:aws:iam::123456789012:role/eksctl-CLUSTER-podidentityrole-karp-Role1-EXAMPLE

# 节点组独立声明，见 eks/nodegroup-system.yaml
managedNodeGroups: []

# 无 Fargate Profile：系统组件已迁至 EC2 Spot 托管节点组，
# 成本更低且 Pod Identity 不支持 Fargate。历史配置见 git 记录。

# 启用必要的插件
addons:
  # coredns 与 metrics-server 原带 podLabels.fargate=enabled 以匹配 Fargate Profile，
  # 迁至 EC2 节点组后不再需要
  - name: coredns
    version: latest
    # 默认只有 preferred 级的 podAntiAffinity，两台系统节点负载接近时不足以拆开：
    # 实测两个副本曾同时落在一台，该节点若被 Spot 回收 DNS 会短暂全断。
    # DoNotSchedule 在单节点时会让第二个副本 Pending —— 对 DNS 而言，
    # 一个可用副本仍能解析，优于两个副本同生共死。
    configurationValues: |-
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              k8s-app: kube-dns
  - name: metrics-server
    version: latest
    # 默认只有 preferred 级反亲和，敌不过调度器"优先选更空节点"的倾向，
    # 两副本会落在同一节点；见 coredns 同段说明。
    configurationValues: |-
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: metrics-server
  - name: eks-pod-identity-agent
    version: latest
  - name: vpc-cni
    version: latest
  - name: kube-proxy
    version: latest
  - name: aws-ebs-csi-driver
    version: latest
  - name: aws-efs-csi-driver
    version: latest
    # controller 有 3 个容器，resources 会统一套用到每个容器上
    configurationValues: |-
      controller:
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        # leader election 模式，见 coredns 同段说明
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels:
                app: efs-csi-controller
  - name: aws-mountpoint-s3-csi-driver
    version: latest
    # 不自带 CriticalAddonsOnly toleration，见 eks/nodegroup-system.yaml 的 taint 说明
    configurationValues: |-
      controller:
        tolerations:
          - key: CriticalAddonsOnly
            operator: Exists

# CloudWatch 日志
cloudWatch:
  clusterLogging:
    enableTypes:
      - api
      - audit
      - authenticator
      - controllerManager
      - scheduler
