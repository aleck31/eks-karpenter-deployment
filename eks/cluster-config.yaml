# cluster-config.yaml - 集群、IAM 与插件配置
#
# 注意 vpc-cni 与 aws-ebs-csi-driver 的 Pod Identity 关联由 addon 自身管理，
# 这样 addon 的 serviceAccountRoleArn 会被清空、ServiceAccount 上不留 IRSA 注解。
# 对已存在的集群直接执行 eksctl create podidentityassociation 会因关联已存在而报 409，
# 这两个应改用：
#   aws eks update-addon --cluster-name <cluster> --addon-name vpc-cni \
#     --pod-identity-associations serviceAccount=aws-node,roleArn=<role-arn>
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: eks-karpenter-env
  region: ap-southeast-1
  version: "1.35"

# VPC 配置 - 使用 10.1.0.0/16 网段
vpc:
  cidr: "10.1.0.0/16"

# 可用区配置 (新加坡区域 3 个 AZ)
availabilityZones:
  - ap-southeast-1a
  - ap-southeast-1b
  - ap-southeast-1c

# IAM 配置
iam:
  withOIDC: true

  # Pod Identity 关联。前三个使用跨集群共用角色，
  # 由 eks/shared-pod-identity-roles.cfn.yaml 创建，两个集群共用同一角色。
  # 变更角色前用 eks/compare-role-permissions.py 校验权限一致性。
  podIdentityAssociations:
    - namespace: kube-system
      serviceAccountName: aws-node
      roleARN: arn:aws:iam::123456789012:role/SharedPodIdentity-VPCCNI

    - namespace: kube-system
      serviceAccountName: ebs-csi-controller-sa
      roleARN: arn:aws:iam::123456789012:role/SharedPodIdentity-EBSCSI

    - namespace: kube-system
      serviceAccountName: aws-load-balancer-controller
      roleARN: arn:aws:iam::123456789012:role/SharedPodIdentity-ALBController

    # EFS CSI 与 S3 CSI 的策略限定具体文件系统与桶，不跨集群共用。
    # 角色为 eksctl 创建 addon 时生成，名称含随机后缀，此处以占位符表示实际 ARN。
    - namespace: kube-system
      serviceAccountName: efs-csi-controller-sa
      roleARN: arn:aws:iam::123456789012:role/eksctl-CLUSTER-addon-aws-efs-csi-dr-Role1-EXAMPLE

    - namespace: kube-system
      serviceAccountName: s3-csi-driver-sa
      roleARN: arn:aws:iam::123456789012:role/eksctl-CLUSTER-addon-aws-mountpoint-Role1-EXAMPLE

    # Loki 需读写自己的 S3 桶，策略含桶名，不共用
    - namespace: logging
      serviceAccountName: loki
      roleARN: arn:aws:iam::123456789012:role/LokiS3Role-CLUSTER

    # Karpenter 亦使用 Pod Identity。其策略含 cluster tag 条件与集群专属节点角色，
    # 不与其他集群共用，由 karpenter/apply-karpenter-policy.sh 按集群渲染。
    - namespace: karpenter
      serviceAccountName: karpenter
      roleARN: arn:aws:iam::123456789012:role/eksctl-CLUSTER-podidentityrole-karp-Role1-EXAMPLE

# 节点组独立声明，见 eks/nodegroup-system.yaml
managedNodeGroups: []

# 无 Fargate Profile：系统组件已迁至 EC2 Spot 托管节点组，
# 成本更低且 Pod Identity 不支持 Fargate。历史配置见 git 记录。

# 启用必要的插件
addons:
  # coredns 与 metrics-server 原带 podLabels.fargate=enabled 以匹配 Fargate Profile，
  # 迁至 EC2 节点组后不再需要
  - name: coredns
    version: latest
  - name: metrics-server
    version: latest
  - name: eks-pod-identity-agent
    version: latest
  - name: vpc-cni
    version: latest
  - name: kube-proxy
    version: latest
  - name: aws-ebs-csi-driver
    version: latest
  - name: aws-efs-csi-driver
    version: latest
    # controller 有 3 个容器，resources 会统一套用到每个容器上
    configurationValues: |-
      controller:
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
  - name: aws-mountpoint-s3-csi-driver
    version: latest

# CloudWatch 日志
cloudWatch:
  clusterLogging:
    enableTypes:
      - api
      - audit
      - authenticator
      - controllerManager
      - scheduler
