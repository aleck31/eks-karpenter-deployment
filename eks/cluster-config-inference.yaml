apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

# inference-env 的 Pod Identity 关联与 addon 配置。
#
# 该集群原先系统组件跑在 Fargate 上，而 Pod Identity Agent 是 DaemonSet、不支持 Fargate，
# 因此只能用 IRSA。系统组件迁至 EC2 托管节点组后，此限制解除。
#
# 本文件的 Pod Identity 关联指向 eks/shared-pod-identity-roles.cfn.yaml 创建的跨集群共用角色。
# 迁移过程中曾用 roleARN 复用各集群自有的 IRSA 角色，待验证稳定后已合并为共用角色，
# 原集群专属角色及其 CloudFormation 栈已删除。
#
# 变更角色前务必用 eks/compare-role-permissions.py 校验权限一致性：
# 仅比对 action 名称不够，Resource 与 Condition 决定实际作用域。
#
# 执行：
#   eksctl create podidentityassociation -f eks/cluster-config-inference.yaml
#   eksctl update addon -f eks/cluster-config-inference.yaml
#
# 注意：vpc-cni 与 aws-ebs-csi-driver 的关联改由 addon 自身管理，
# 这样 addon 的 serviceAccountRoleArn 会被清空、ServiceAccount 上不再留 IRSA 注解：
#   aws eks update-addon --cluster-name <cluster> --addon-name vpc-cni \
#     --pod-identity-associations serviceAccount=aws-node,roleArn=<SharedPodIdentity-VPCCNI ARN>

metadata:
  name: inference-env
  region: us-west-2

# API Server 端点访问控制，说明见 eks/cluster-config.yaml 同段注释。
# 收窄 publicAccessCIDRs 前必须先开 privateAccess，否则节点经 NAT 走公网端点会失联。
vpc:
  clusterEndpoints:
    publicAccess: true
    privateAccess: true

iam:
  podIdentityAssociations:
    # 以下三个为跨集群共用角色（两个集群共用同一角色）
    - namespace: kube-system
      serviceAccountName: aws-node
      roleARN: arn:aws:iam::123456789012:role/SharedPodIdentity-VPCCNI

    - namespace: kube-system
      serviceAccountName: ebs-csi-controller-sa
      roleARN: arn:aws:iam::123456789012:role/SharedPodIdentity-EBSCSI

    - namespace: kube-system
      serviceAccountName: aws-load-balancer-controller
      roleARN: arn:aws:iam::123456789012:role/SharedPodIdentity-ALBController

    # Karpenter 不共用：策略含 cluster tag 条件与集群专属节点角色名，
    # 共用需放宽到通配符、牺牲集群间隔离。各集群保留自己的角色。
    - namespace: karpenter
      serviceAccountName: karpenter
      roleARN: arn:aws:iam::123456789012:role/KarpenterIRSA-inference-env

addons:
  # Pod Identity Agent：DaemonSet，为同节点 Pod 提供凭据
  - name: eks-pod-identity-agent
    version: latest

  # 以下 addon 原带 podLabels.fargate=enabled 以匹配 Fargate Profile，
  # 迁至 EC2 后移除该标签（configurationValues 置空即恢复默认）
  - name: coredns
    version: latest
  - name: metrics-server
    version: latest
