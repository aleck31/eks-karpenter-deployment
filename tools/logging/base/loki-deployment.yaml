# Loki Deployment + Service + ServiceAccount + WAL PVC
# 存储：chunk/index → S3；WAL → EFS（EBS 有 AZ 亲和，Spot 换 AZ 后挂不上）
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loki
  namespace: logging
  # S3 权限由 Pod Identity 提供，关联命令见部署指南第 3 节

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-wal
  namespace: logging
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: efs-sc
  resources:
    requests:
      # EFS 按实际用量计费，此值仅为声明
      storage: 5Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: logging
  labels:
    app: loki
spec:
  replicas: 1
  strategy:
    # WAL 是 ReadWriteOnce，滚动更新会争抢挂载
    type: Recreate
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '3100'
        prometheus.io/path: '/metrics'
    spec:
      serviceAccountName: loki
      # Spot 中断时留出 flush 时间
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: loki
          image: grafana/loki:3.6.15
          args:
            - -config.file=/etc/loki/config.yaml
            # 展开配置中的 ${LOKI_S3_BUCKET} / ${AWS_REGION}
            - -config.expand-env=true
          envFrom:
            # 由 overlay 的 configMapGenerator 提供
            - configMapRef:
                name: logging-env
          ports:
            - name: http
              containerPort: 3100
            - name: grpc
              containerPort: 9095
          volumeMounts:
            - name: config
              mountPath: /etc/loki
            - name: data
              mountPath: /loki
          resources:
            requests:
              # 实测 132Mi / 7m，留约 2 倍余量
              cpu: 100m
              memory: 320Mi
            limits:
              cpu: "1"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /ready
              port: 3100
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /ready
              port: 3100
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: data
          persistentVolumeClaim:
            claimName: loki-wal

---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: logging
  labels:
    app: loki
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3100
      targetPort: 3100
      protocol: TCP
    - name: grpc
      port: 9095
      targetPort: 9095
      protocol: TCP
  selector:
    app: loki
