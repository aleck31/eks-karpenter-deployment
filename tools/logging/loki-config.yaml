# Loki SingleBinary：chunk/index 存 S3，WAL 存 EFS，30 天保留期由 compactor 管理
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: logging
data:
  config.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9095
      log_level: info
      # 配合 Pod terminationGracePeriodSeconds，Spot 中断时留出 flush 时间
      graceful_shutdown_timeout: 60s

    common:
      path_prefix: /loki
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    # 不配 access_key，凭证由 Pod Identity 提供
    storage_config:
      aws:
        bucketnames: eks-env-logs-xxxx-ap-southeast-1
        region: ap-southeast-1
        s3forcepathstyle: false
      tsdb_shipper:
        active_index_directory: /loki/tsdb-index
        cache_location: /loki/tsdb-cache
        cache_ttl: 24h

    schema_config:
      configs:
        # from 须为过去日期，否则不生效
        - from: 2026-01-01
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: index_
            period: 24h

    ingester:
      # WAL 在 EFS 上，Pod 重建后可恢复未 flush 的数据
      wal:
        enabled: true
        dir: /loki/wal
      chunk_idle_period: 5m
      chunk_retain_period: 30s
      # 乱序接收窗口 = max_chunk_age / 2 = 1h，须 >= Alloy journal max_age
      max_chunk_age: 2h

    compactor:
      working_directory: /loki/compactor
      # 由 compactor 执行：先更新 index 再删 chunk。
      # 用 S3 生命周期会导致 index 引用已删除的 chunk
      retention_enabled: true
      retention_delete_delay: 2h
      retention_delete_worker_count: 50
      delete_request_store: s3
      compaction_interval: 10m

    limits_config:
      retention_period: 720h          # 30 天
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      max_line_size: 256KB
      max_line_size_truncate: true
      ingestion_rate_mb: 8
      ingestion_burst_size_mb: 16
      # 允许上报结构化元数据
      allow_structured_metadata: true
      volume_enabled: true

    query_range:
      align_queries_with_step: true
      cache_results: true
      results_cache:
        cache:
          embedded_cache:
            enabled: true
            max_size_mb: 100

    ruler:
      storage:
        type: local
        local:
          directory: /loki/rules

    # 关闭匿名统计上报
    analytics:
      reporting_enabled: false
